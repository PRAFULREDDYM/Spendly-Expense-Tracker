<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1117" />
    <title>Offline - Expense Tracker</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f18;
        --card: #151722;
        --text: #eeeffe;
        --muted: #8b8fa8;
        --border: rgba(255, 255, 255, 0.08);
        --accent: #4f6bff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(79, 107, 255, 0.18), transparent 35%),
          var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        padding: 28px 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline.</h1>
      <p>Open the app again when you're connected to sync your latest expense data.</p>
      <a href="/">Open the app</a>
    </main>
  </body>
</html>
